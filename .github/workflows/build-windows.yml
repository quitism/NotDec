name: Build NotDec Windows Binary

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache LLVM 14 binaries
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-14.0.6.obj
          key: llvm-14.0.6-windows-win64-v2

      - name: Download and extract LLVM 14 if not cached
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/LLVM-14.0.6-win64.exe"
          Write-Host "Downloading LLVM 14 prebuilts..."
          Invoke-WebRequest -Uri $url -OutFile "llvm-installer.exe"
          
          Write-Host "Extracting LLVM..."
          New-Item -ItemType Directory -Force -Path "llvm-14.0.6.obj" | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x "llvm-installer.exe" -ollvm-14.0.6.obj -y
          Remove-Item "llvm-installer.exe"

      - name: Verify LLVM Path Exists
        shell: pwsh
        run: |
          if (-not (Test-Path "llvm-14.0.6.obj/include/llvm")) {
              Write-Error "LLVM include directory not found at llvm-14.0.6.obj/include/llvm!"
              exit 1
          }
          Write-Host "LLVM path verified successfully."

      - name: Install Boost via vcpkg
        shell: pwsh
        run: |
          vcpkg install boost-system:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($vsPath) {
              Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.Dll"
              Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation
          }

          cmake -B build -G "Ninja" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notdec-windows-exe
          path: |
            build/bin/**/*.exe
            build/bin/**/*.dll
