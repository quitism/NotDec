name: Build NotDec Windows Binary

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache LLVM 14 binaries
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-14.0.6.obj
          key: llvm-14.0.6-windows-win64-v5

      - name: Download and extract LLVM 14 if not cached
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Test-Path "llvm-14.0.6.obj") { Remove-Item -Recurse -Force "llvm-14.0.6.obj" }
          
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/LLVM-14.0.6-win64.exe"
          Write-Host "Downloading LLVM 14 installer..."
          Invoke-WebRequest -Uri $url -OutFile "llvm-installer.exe"
          
          Write-Host "Extracting installer payload..."
          New-Item -ItemType Directory -Force -Path "llvm-14.0.6.obj" | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x "llvm-installer.exe" -o"llvm-14.0.6.obj" -y
          Remove-Item "llvm-installer.exe"

      - name: Locate and Flatten LLVM Directory Structure
        shell: pwsh
        run: |
          Write-Host "Searching extracted contents..."
          $includePath = Get-ChildItem -Path "llvm-14.0.6.obj" -Recurse -Directory -Filter "include" | Select-Object -First 1
          
          if ($includePath) {
              $payloadRoot = $includePath.Parent.FullName
              Write-Host "Found LLVM payload root at: $payloadRoot"
              
              # Move everything from the payload root up to llvm-14.0.6.obj root if it's nested
              if ($payloadRoot -ne (Resolve-Path "llvm-14.0.6.obj").Path) {
                  Get-ChildItem -Path $payloadRoot | Move-Item -Destination "llvm-14.0.6.obj" -Force
              }
          }

          # If there's still no include/llvm, print out what's actually inside for debugging
          if (-not (Test-Path "llvm-14.0.6.obj/include/llvm")) {
              Write-Error "Still cannot find include/llvm. Dumping directory tree:"
              Get-ChildItem -Path "llvm-14.0.6.obj" -Recurse -Depth 2 | Select-Object -First 50 FullName
              exit 1
          }
          Write-Host "LLVM structure verified successfully!"

      - name: Verify and Fix LLVM Path Structure
        shell: pwsh
        run: |
          # If include/llvm doesn't exist directly, check if 7z nested it inside a subfolder
          if (-not (Test-Path "llvm-14.0.6.obj/include/llvm")) {
              Write-Host "LLVM headers not in expected root. Searching for nested structure..."
              $includeDir = Get-ChildItem -Path "llvm-14.0.6.obj" -Recurse -Directory -Filter "include" | Select-Object -First 1
              if ($includeDir) {
                  $srcRoot = $includeDir.Parent.FullName
                  if ($srcRoot -ne (Resolve-Path "llvm-14.0.6.obj").Path) {
                      Write-Host "Moving contents from nested folder ($srcRoot) to root..."
                      Get-ChildItem -Path $srcRoot | Move-Item -Destination "llvm-14.0.6.obj" -Force
                  }
              }
          }

          # Final sanity check
          if (-not (Test-Path "llvm-14.0.6.obj/include/llvm")) {
              Write-Error "LLVM include directory still not found at llvm-14.0.6.obj/include/llvm!"
              Get-ChildItem -Path "llvm-14.0.6.obj" -Recurse | Select-Object -First 20 FullName
              exit 1
          }
          Write-Host "LLVM path verified successfully."

      - name: Install Boost via vcpkg
        shell: pwsh
        run: |
          vcpkg install boost-system:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($vsPath) {
              Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.Dll"
              Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation
          }

          cmake -B build -G "Ninja" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notdec-windows-exe
          path: |
            build/bin/**/*.exe
            build/bin/**/*.dll
