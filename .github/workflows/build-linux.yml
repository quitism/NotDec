name: Build NotDec Linux/Cross Binary

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt python-is-python3 clang-14 cmake zlib1g-dev g++ ninja-build libboost-all-dev lld

      - name: Install wasi-sdk
        run: |
          wget -nv https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz -P /tmp
          sudo tar xf /tmp/wasi-sdk-20.0-linux.tar.gz -C /opt

      - name: Download prebuilt LLVM 14.0.6
        run: |
          wget -nv https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz
          mkdir llvm-14.0.6.obj
          tar xf clang+llvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz -C llvm-14.0.6.obj --strip-components=1
          rm clang+llvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz
          ls llvm-14.0.6.obj/lib/cmake
          ls llvm-14.0.6.obj/lib | grep -E "libLLVM-|libclang-cpp" || echo "no shared llvm libs, good"

      - name: Configure CMake
        run: |
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE \
                -DCMAKE_C_COMPILER:FILEPATH=/usr/bin/clang-14 \
                -DCMAKE_CXX_COMPILER:FILEPATH=/usr/bin/clang++-14 \
                -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
                --no-warn-unused-cli -S . -B ./build -G Ninja

      - name: Build Project
        run: |
          cmake --build ./build --target all --parallel $(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notdec-binary
          path: build/bin/
